[package]
name         = "mirror"
version      = "1.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/mirror"
description  = "Payload-blind append-ingest mirror daemon: the sema version-control remote."

[lib]
name = "mirror"
path = "src/lib.rs"

[[bin]]
name = "mirror"
path = "src/bin/mirror.rs"
required-features = ["dotos-text"]

[[bin]]
name = "meta-mirror"
path = "src/bin/meta_mirror.rs"
required-features = ["dotos-text"]

[[bin]]
name = "mirror-daemon"
path = "src/bin/mirror_daemon.rs"

[[bin]]
name = "mirror-write-configuration"
path = "src/bin/mirror_write_configuration.rs"
required-features = ["dotos-text"]

# The two-VM criome-auth witness's in-VM full-body verifier: reads the landed
# body back over Restore and re-derives its content address. Gated behind the
# `witness` feature so the default daemon build stays lean.
[[bin]]
name = "mirror-landed-body-verifier"
path = "src/bin/mirror_landed_body_verifier.rs"
required-features = ["witness"]

[features]
default = []
# Dotos is the human/agent text surface at the CLI edges. The daemon itself
# receives only allocated binary Signal frames.
datom-cli = ["dep:datom-codec", "dep:protos", "signal-mirror/datom", "meta-signal-mirror/datom"]
dotos-text = ["datom-cli"]
# witness builds the two-VM witness verifier bin alongside the Dotos CLIs
# (the witness package node-b installs needs both). It adds no new dependency.
witness = ["datom-cli"]

[dependencies]
meta-signal-mirror = { git = "https://github.com/LiGoldragon/meta-signal-mirror.git", rev = "bdc76bcdd09107a3d039ad434b772e3474861520", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "f2cc06858d38a4028c928d33323a6d682e7c222f", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad", optional = true }
rkyv               = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine        = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "7158e5503f37fd2fbca1d707f134e38a3fda1176" }
signal-mirror      = { git = "https://github.com/LiGoldragon/signal-mirror.git", rev = "e6c565caac516dae3fc679ea5e110828580f3d57", default-features = false }
signal-standard    = { git = "https://github.com/LiGoldragon/signal-standard.git", rev = "2c90fc9976b3af33f49cdf83bb33f7f246ae2b60", default-features = false }
signal-frame-interface = { package = "signal-frame", git = "https://github.com/LiGoldragon/signal-frame.git", rev = "01676293a623d97b65e320d4138c4b480c6d5dad" }
thiserror          = "2"
tokio              = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
triad-runtime      = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "7d10bb9d9a08ce363a0be8cff2716103f0a326fe" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
